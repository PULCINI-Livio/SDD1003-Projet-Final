<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>SDD1003-Projet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10 text-gray-900">
  <h1 class="text-3xl font-bold mb-6">Steam Releases Explorer</h1>

  <div id="dbStatus" class="p-2 text-sm font-semibold"></div>

  <!-- RECHERCHE -->
  <div class="mb-6 flex gap-2">
    <input id="searchInput" type="text" placeholder="Recherche..." 
      class="px-3 py-2 border rounded w-64 shadow-sm">
  </div>
  <div id="autocompleteBox"
     class="absolute bg-white border rounded shadow mt-1 hidden w-full z-10">
  </div>

  <!-- AJOUT -->
  <h2 class="text-xl font-semibold mb-2">Ajouter une release</h2>
  <div class="flex gap-2 mb-6">
    <input id="newGame" placeholder="Game" class="px-3 py-2 border rounded shadow-sm">
    <input id="newPublisher" placeholder="Publisher" class="px-3 py-2 border rounded shadow-sm">
    <input id="newDeveloper" placeholder="Developer" class="px-3 py-2 border rounded shadow-sm">
    <input id="newRating" placeholder="Rating" class="px-3 py-2 border rounded shadow-sm">
    <input id="newPrimaryGenre" placeholder="PrimaryGenre" class="px-3 py-2 border rounded shadow-sm">

    <button onclick="addRelease()"
      class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 shadow">
      Ajouter</button>
  </div>



  <!-- FORMULAIRE EDIT -->
  <div id="editFormContainer"
    class="hidden absolute bg-white p-4 rounded shadow border w-full">
    <h3 class="text-lg font-semibold mb-3">Modifier la release</h3>

    <input id="editGame" placeholder="Game"
      class="w-full mb-2 px-3 py-2 border rounded shadow-sm">

    <input id="editPublisher" placeholder="Publisher"
      class="w-full mb-2 px-3 py-2 border rounded shadow-sm">

    <input id="editDeveloper" placeholder="Developer"
      class="w-full mb-4 px-3 py-2 border rounded shadow-sm">

    <input id="editRating" placeholder="Rating"
      class="w-full mb-4 px-3 py-2 border rounded shadow-sm">

    <input id="editPrimaryGenre" placeholder="PrimaryGenre"
      class="w-full mb-4 px-3 py-2 border rounded shadow-sm">

    <div class="flex gap-2">
      <button onclick="submitEdit()"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 shadow">
        Valider
      </button>

      <button onclick="closeEditForm()"
        class="px-4 py-2 bg-gray-400 text-white rounded hover:bg-gray-500 shadow">
        Annuler
      </button>
    </div>
  </div>

  <!-- LISTE DES RELEASES -->
  <ul id="list" class="space-y-3"></ul>

  <script>
    async function search() {
      const q = searchInput.value.trim();
      if (q === "") return showFirstTen();
      return runSearch(q);
    }
    
    async function runSearch(text) {
      const res = await fetch(`/releases/search?q=${encodeURIComponent(text)}`);
      const list = await res.json();

      display(list);
    }

    async function addRelease() {
      const data = {
        game: document.getElementById("newGame").value,
        publisher: document.getElementById("newPublisher").value,
        developer: document.getElementById("newDeveloper").value,
        rating: document.getElementById("newRating").value,
        primary_genre: document.getElementById("newPrimaryGenre").value
      };
      await fetch("/releases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });

      // Réinitialisation du formulaire
      document.getElementById("newGame").value = "";
      document.getElementById("newPublisher").value = "";
      document.getElementById("newDeveloper").value = "";
      document.getElementById("newRating").value = "";
      document.getElementById("newPrimaryGenre").value = "";
      search();
    }

    //let currentEditId = null;

    // Modifier : ouvrir le formulaire
    function updateRelease(item, id) {
      const form = document.getElementById("editFormContainer");

      // Remplir les champs
      document.getElementById("editGame").value = item.game || "";
      document.getElementById("editPublisher").value = item.publisher || "";
      document.getElementById("editDeveloper").value = item.developer || "";
      document.getElementById("editRating").value = item.Rating || "";
      document.getElementById("editPrimaryGenre").value = item.primary_genre || "";

      // Récupérer le LI correspondant
      const li = document.getElementById("li-" + id);
      const rect = li.getBoundingClientRect();

      // Positionner le formulaire juste en dessous
      form.style.top = window.scrollY + rect.bottom + "px";
      form.style.left = rect.left + "px";

      form.classList.remove("hidden");
      currentEditId = id;
    }

    // Fermer le formulaire
    function closeEditForm() {
      currentEditId = null;
      document.getElementById("editFormContainer").classList.add("hidden");
    }

    // Soumettre modification
    async function submitEdit() {
      const data = {
          game: document.getElementById("editGame").value,
          publisher: document.getElementById("editPublisher").value,
          developer: document.getElementById("editDeveloper").value,
          rating: document.getElementById("editRating").value,
          primary_genre: document.getElementById("editPrimaryGenre").value
      };

      await fetch(`/releases/${currentEditId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
      });

      closeEditForm();
      search();
    }

    async function deleteRelease(id) {
      await fetch(`/releases/${id}`, { method: "DELETE" });
      search();
    }

    function display(releases) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      releases.forEach(i => {
        list.innerHTML += `
          <li id="li-${i._id}" class="bg-white p-4 rounded shadow flex justify-between items-center">
            <div>
              <span class="font-semibold">${i.game}</span><br>
              <span class="text-sm text-gray-600">Publisher : ${i.publisher || ""}</span><br>
              <span class="text-sm text-gray-600">Developer : ${i.developer || ""}</span><br>
              <span class="text-sm text-gray-600">Rating : ${i.rating || ""}</span><br>
              <span class="text-sm text-gray-600">Primary Genre : ${i.primary_genre || ""}</span>
            </div>

            <div class="flex gap-2">
              <button onclick='updateRelease(${JSON.stringify(i)}, "${i._id}")'
                class="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 shadow">
                Modifier
              </button>

              <button onclick="deleteRelease('${i._id}')"
                class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 shadow">
                Supprimer
              </button>
            </div>
          </li>
        `;
      });
    }

    function displaySingle(release) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      list.innerHTML += `
        <li id="li-${release._id}" class="bg-white p-4 rounded shadow flex justify-between items-center">
          <div>
            <span class="font-semibold">${release.game}</span><br>
            <span class="text-sm text-gray-600">Publisher : ${release.publisher || ""}</span><br>
            <span class="text-sm text-gray-600">Developer : ${release.developer || ""}</span><br>
            <span class="text-sm text-gray-600">Rating : ${release.rating || ""}</span><br>
            <span class="text-sm text-gray-600">Primary Genre : ${release.primary_genre || ""}</span>
          </div>

          <div class="flex gap-2">
            <button onclick='updateRelease(${JSON.stringify(release)}, "${release._id}")'
              class="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 shadow">
              Modifier
            </button>

            <button onclick="deleteRelease('${release._id}')"
              class="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 shadow">
              Supprimer
            </button>
          </div>
        </li>
      `;
    }

    const searchInput = document.getElementById("searchInput");
    const autocompleteBox = document.getElementById("autocompleteBox");

    searchInput.addEventListener("focus", () => {
      if (autocompleteBox.innerHTML.trim() !== "") {
        autocompleteBox.classList.remove("hidden");
      }
    });

    document.addEventListener("click", (e) => {
      // Si on clique NI dans l'input NI dans la liste ⇒ cacher
      if (!searchInput.contains(e.target) && !autocompleteBox.contains(e.target)) {
        autocompleteBox.classList.add("hidden");
      }
    });

    searchInput.addEventListener("keyup", async (e) => {
      const value = searchInput.value.trim();

      // 1️⃣ Entrée → lancer la recherche principale
      if (e.key === "Enter") {
        if (value === "") return showFirstTen();
        return runSearch(value);
      }

      // 2️⃣ Espace sur champ vide → afficher les 10 premiers
      if (e.key === " " && value === "") {
        return showFirstTen();
      }

      // 3️⃣ Autocomplétion si > 1 caractère
      if (value.length > 1) {
        const res = await fetch(`/releases/autocomplete?q=${value}`);
        const suggestions = await res.json();
        showAutocomplete(suggestions);
      } else {
        autocompleteBox.classList.add("hidden");
      }
    });

    function showAutocomplete(list) {
      if (!list.length) {
        autocompleteBox.classList.add("hidden");
        return;
      }

      autocompleteBox.innerHTML = list
        .map(item => `
          <div class="p-2 hover:bg-gray-100 cursor-pointer"
              onclick="selectAutocomplete('${item._id}')">
            ${item.game}
          </div>
        `)
        .join("");

      // On n'affiche que si l'input est actif
      if (document.activeElement === searchInput) {
        autocompleteBox.classList.remove("hidden");
      }
    }


    async function selectAutocomplete(id) {
      autocompleteBox.classList.add("hidden");

      const res = await fetch(`/releases/${id}`);
      const item = await res.json();

      displaySingle(item); // Fonction à faire qui affiche 1 release
    }

    async function showFirstTen() {
      const res = await fetch("/releases/first10");
      const list = await res.json();

      display(list); // Ta fonction existante qui affiche plusieurs releases
    }

    async function checkDB() {
      const res = await fetch("/db-status");
      const data = await res.json();

      const dbDiv = document.getElementById("dbStatus");

      if (data.connected) {
        dbDiv.textContent = "Base de données connectée";
        dbDiv.classList.add("text-green-600");
      } else {
        dbDiv.textContent = "Base de données NON connectée";
        dbDiv.classList.add("text-red-600");
      }
    }

    checkDB(); // appel immédiat au chargement
  </script>
</body>
</html>
