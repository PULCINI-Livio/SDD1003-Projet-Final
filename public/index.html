<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CRUD + Search</title>
</head>
<body>
  <h1>Base CRUD + MongoDB</h1>

  <input id="search" placeholder="Recherche..." />
  <button onclick="search()">Rechercher</button>

  <h3>Ajouter une release</h3>
  <input id="newGame" placeholder="Game" />
  <input id="newPublisher" placeholder="Publisher" />
  <input id="newDeveloper" placeholder="Developer" />
  <button onclick="addRelease()">Ajouter</button>

  <h3>Résultats</h3>
  <ul id="list"></ul>

  <div id="editFormContainer" style="display:none; border:1px solid #ccc; padding:10px; margin-top:10px;">
    <h3>Modifier la release</h3>
    <input id="editGame" placeholder="Game"><br>
    <input id="editPublisher" placeholder="Publisher"><br>
    <input id="editDeveloper" placeholder="Developer"><br>
    <button onclick="submitEdit()">Valider</button>
    <button onclick="closeEditForm()">Annuler</button>
  </div>

  <script>
    async function search() {
      const q = document.getElementById("search").value;
      const res = await fetch(`/releases?q=${q}`);
      const data = await res.json();
      display(data);
    }

    async function addRelease() {
      const data = {
        game: document.getElementById("newGame").value,
        publisher: document.getElementById("newPublisher").value,
        developer: document.getElementById("newDeveloper").value
      };
      await fetch("/releases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      search();
    }

    // Modifier : ouvrir le formulaire
    function updateRelease(item) {
    currentEditId = item._id;
    document.getElementById("editGame").value = item.game || "";
    document.getElementById("editPublisher").value = item.publisher || "";
    document.getElementById("editDeveloper").value = item.developer || "";
    document.getElementById("editFormContainer").style.display = "block";
    }

    // Fermer le formulaire
    function closeEditForm() {
    currentEditId = null;
    document.getElementById("editFormContainer").style.display = "none";
    }

    // Soumettre modification
    async function submitEdit() {
    const data = {
        game: document.getElementById("editGame").value,
        publisher: document.getElementById("editPublisher").value,
        developer: document.getElementById("editDeveloper").value
    };

    await fetch(`/releases/${currentEditId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
    });

    closeEditForm();
    search();
    }

    async function deleteRelease(id) {
      await fetch(`/releases/${id}`, { method: "DELETE" });
      search();
    }

    function display(releases) {
      const list = document.getElementById("list");
      list.innerHTML = "";
      releases.forEach(i => {
        list.innerHTML += `
          <li>
            ${i.game} - ${i.publisher || ""} - ${i.developer || ""}
            <button onclick='updateRelease(${JSON.stringify(i)})'>Modifier</button>
            <button onclick="deleteRelease('${i._id}')">Supprimer</button>
          </li>`;
      });
    }

    search();
  </script>
</body>
</html>
